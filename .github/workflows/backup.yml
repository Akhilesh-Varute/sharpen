name: Nightly backup

# Dumps the Turso database to backups/ and commits it, so there's a
# point-in-time, diffable history of journal/habit/learning data that
# doesn't depend on Turso itself staying reachable. See README's
# "Backups" section.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN
# (the same production values set on Vercel).

on:
  schedule:
    # 18:30 UTC = 00:00 IST -- once a day, off-peak.
    - cron: "30 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run backup
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run db:backup

      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f backups/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Nightly backup $(date -u +%Y-%m-%d)"
          git push
